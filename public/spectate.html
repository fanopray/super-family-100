<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nonton - Super Family 100 & ABC 5 Dasar</title>
  <link rel="stylesheet" href="abc-style.css">
  <style>
    .spectate-badge { background: #ff9800; color: #000; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; display: inline-block; margin-bottom: 10px; }
    .spectate-container { width: 100%; max-width: 650px; margin: 0 auto; padding: 15px; }
    
    .room-list { margin: 20px 0; }
    .room-card { padding: 14px 18px; background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 12px; margin: 8px 0; cursor: pointer; transition: all 0.3s; display: flex; justify-content: space-between; align-items: center; }
    .room-card:hover { border-color: #00e5ff; background: rgba(0,229,255,0.08); transform: translateY(-1px); }
    .room-card .room-info { flex: 1; }
    .room-card .room-code-label { color: #00e5ff; font-weight: bold; font-size: 1.1rem; }
    .room-card .room-players { color: #aaa; font-size: 0.85rem; margin-top: 3px; }
    .room-card .room-state { color: #888; font-size: 0.8rem; margin-top: 2px; }
    .room-card .room-type { padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; font-weight: bold; }
    .room-card .room-type.family { background: rgba(255,215,0,0.2); color: #ffd700; }
    .room-card .room-type.abc { background: rgba(0,229,255,0.2); color: #00e5ff; }
    
    .no-rooms { text-align: center; color: #666; padding: 40px 20px; }
    .refresh-btn { background: rgba(255,255,255,0.05); border: 1px solid #555; color: #aaa; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: all 0.3s; }
    .refresh-btn:hover { border-color: #00e5ff; color: #00e5ff; }
    
    .spec-question { background: rgba(0,229,255,0.08); border: 1px solid rgba(0,229,255,0.3); border-radius: 12px; padding: 15px; margin: 12px 0; text-align: center; font-size: 1.1rem; }
    .spec-answers { display: grid; gap: 8px; margin: 12px 0; }
    .spec-answer { padding: 10px 15px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .spec-answer.revealed { background: rgba(72,187,120,0.2); border-color: #48bb78; }
    .spec-answer .ans-text { font-weight: bold; }
    .spec-answer .ans-score { color: #00e5ff; font-weight: bold; }
    .spec-answer.hidden .ans-text { color: #555; }
    
    .spec-scoreboard { display: flex; justify-content: space-around; margin: 12px 0; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 10px; }
    .spec-player { text-align: center; }
    .spec-player .name { color: #aaa; font-size: 0.85rem; }
    .spec-player .score { color: #00e5ff; font-size: 1.5rem; font-weight: bold; }
    
    .spec-status { text-align: center; padding: 10px; color: #ffd700; font-weight: bold; font-size: 1rem; }
    .spec-strikes { text-align: center; font-size: 1.5rem; margin: 8px 0; }
    
    .spec-log { max-height: 250px; overflow-y: auto; border: 1px solid #333; border-radius: 10px; padding: 8px; background: rgba(0,0,0,0.2); margin: 10px 0; }
    .spec-log-entry { padding: 5px 10px; margin: 3px 0; border-radius: 6px; font-size: 0.85rem; display: flex; justify-content: space-between; }
    .spec-log-entry.valid { background: rgba(72,187,120,0.15); border-left: 3px solid #48bb78; }
    .spec-log-entry.invalid { background: rgba(229,62,62,0.15); border-left: 3px solid #e53e3e; }
    .spec-log-entry .log-player { color: #aaa; font-size: 0.8rem; }
    
    .spec-round-info { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(255,255,255,0.03); border-radius: 8px; margin: 8px 0; color: #aaa; font-size: 0.9rem; }
    
    .spec-letter { text-align: center; margin: 10px 0; }
    .spec-letter span { font-size: 3.5rem; font-weight: bold; color: #00e5ff; text-shadow: 0 0 20px rgba(0,229,255,0.5); }
    
    .live-dot { width: 10px; height: 10px; background: #e53e3e; border-radius: 50%; display: inline-block; margin-right: 6px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    
    .back-to-list { background: none; border: 1px solid #555; color: #aaa; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
    .back-to-list:hover { border-color: #00e5ff; color: #00e5ff; }
  </style>
</head>
<body>
  <div id="app">
    <!-- ROOM LIST SCREEN -->
    <div id="spec-home" class="screen active">
      <div class="container-center">
        <h1 class="game-title">👁️ MODE PENONTON</h1>
        <p class="subtitle">Pilih pertandingan yang ingin ditonton</p>
        
        <div style="display:flex;justify-content:space-between;align-items:center;margin:15px 0;">
          <span style="color:#aaa;font-size:0.9rem;">Room aktif:</span>
          <button class="refresh-btn" id="btnRefresh" onclick="refreshRooms()">🔄 Refresh</button>
        </div>
        
        <div class="room-list" id="roomList">
          <div class="no-rooms">⏳ Memuat daftar room...</div>
        </div>
        
        <a href="/" class="btn btn-back" style="display:inline-block;margin-top:15px;text-decoration:none;">← Kembali</a>
      </div>
    </div>

    <!-- SPECTATE SCREEN -->
    <div id="spec-watch" class="screen">
      <div class="spectate-container">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="spectate-badge"><span class="live-dot"></span>LIVE NONTON</span>
          <button class="back-to-list" onclick="backToList()">← Daftar Room</button>
        </div>
        
        <!-- Family 100 View -->
        <div id="familyView" style="display:none;">
          <div class="spec-scoreboard" id="specFamilyScoreboard"></div>
          <div class="spec-round-info">
            <span id="specFamilyRound">Ronde 1/3</span>
            <span id="specFamilyMultiplier">1x</span>
          </div>
          <div class="spec-question" id="specFamilyQuestion">Menunggu pertanyaan...</div>
          <div class="spec-strikes" id="specFamilyStrikes"></div>
          <div class="spec-answers" id="specFamilyAnswers"></div>
          <div class="spec-status" id="specFamilyStatus">Menunggu game dimulai...</div>
        </div>
        
        <!-- ABC View -->
        <div id="abcView" style="display:none;">
          <div class="scoreboard-abc" id="specAbcScoreboard"></div>
          <div class="spec-round-info">
            <span id="specAbcRound">Babak 1/5</span>
            <span id="specAbcCategory">Kategori: -</span>
          </div>
          <div class="spec-letter"><span id="specAbcLetter">-</span></div>
          <div class="spec-log" id="specAbcLog"></div>
          <div class="spec-status" id="specAbcStatus">Menunggu game dimulai...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="spectate.js"></script>
</body>
</html>
